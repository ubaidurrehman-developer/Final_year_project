<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Reset — OTP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0891b2 0%, #06b6d4 40%, #0e7490 70%, #164e63 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* Floating background circles for depth */
    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
      top: -100px;
      left: -100px;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
      bottom: -80px;
      right: -80px;
      pointer-events: none;
    }

    .card {
      background: #c0cace;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 420px;
    }

    h2 {
      margin-bottom: 8px;
      font-size: 22px;
      color: #1a1a1a;
    }

    p.subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #333;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      transition: border 0.2s;
    }

    input:focus { border-color: #4f46e5; }

    input.otp-input {
      font-size: 26px;
      letter-spacing: 14px;
      text-align: center;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s;
    }

    button:hover { background: #4338ca; }
    button:disabled { background: #a5a3f5; cursor: not-allowed; }

    .msg {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }

    .msg.success { background: #ecfdf5; color: #065f46; border: 1px solid #6ee7b7; }
    .msg.error   { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }

    .back-link {
      display: inline-block;
      margin-top: 18px;
      font-size: 13px;
      color: #4f46e5;
      cursor: pointer;
      text-decoration: underline;
    }

    /* Step visibility */
    #step-email, #step-otp, #step-done { display: none; }
    #step-email.active, #step-otp.active, #step-done.active { display: block; }
  </style>
</head>
<body>

<div class="card">

  <!-- STEP 1: Enter Email -->
  <div id="step-email" class="active">
    <h2>Forgot Password?</h2>
    <p class="subtitle">Enter your email and we'll send you a 5-digit OTP.</p>

    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="you@example.com" />

    <button id="btn-send-otp" onclick="requestOTP()">Send OTP</button>
    <div class="msg" id="msg-email"></div>
  </div>

  <!-- STEP 2: Enter OTP -->
  <div id="step-otp">
    <h2>Enter OTP</h2>
    <p class="subtitle">We sent a 5-digit code to <strong id="display-email"></strong>.</p>

    <label for="otp">OTP Code</label>
    <input
      type="text"
      id="otp"
      class="otp-input"
      maxlength="5"
      placeholder="_ _ _ _ _"
      oninput="this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '')"
      onkeyup="this.value = this.value.toUpperCase()"
    />

    <button id="btn-verify-otp" onclick="verifyOTP()">Verify OTP</button>
    <div class="msg" id="msg-otp"></div>
    <span class="back-link" onclick="goBack()">← Use a different email</span>
  </div>

  <!-- STEP 3: Success -->
  <div id="step-done">
    <h2>✅ Verified!</h2>
    <p class="subtitle" style="margin-top: 10px;">
      Your identity has been confirmed. You can now reset your password.
    </p>
    <button onclick="alert('Redirect to your password-change page here.')">
      Continue to Reset Password
    </button>
  </div>

</div>

<script>
  const API_BASE = "http://127.0.0.1:8000/auth"; // Change to your Django server URL

  function showStep(stepId) {
    ["step-email", "step-otp", "step-done"].forEach(id => {
      document.getElementById(id).classList.remove("active");
    });
    document.getElementById(stepId).classList.add("active");
  }

  function showMsg(msgId, text, type) {
    const el = document.getElementById(msgId);
    el.textContent = text;
    el.className = "msg " + type;
    el.style.display = "block";
  }

  function clearMsg(msgId) {
    const el = document.getElementById(msgId);
    el.style.display = "none";
  }

  async function requestOTP() {
    const email = document.getElementById("email").value.trim();
    const btn   = document.getElementById("btn-send-otp");

    if (!email) {
      showMsg("msg-email", "Please enter your email address.", "error");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Sending...";
    clearMsg("msg-email");

    try {
      const res  = await fetch(`${API_BASE}/request-otp/`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      });

      const data = await res.json();

      if (res.ok) {
        document.getElementById("display-email").textContent = email;
        showStep("step-otp");
      } else {
        showMsg("msg-email", data.error || "Something went wrong.", "error");
      }
    } catch (err) {
      showMsg("msg-email", "Could not reach the server. Is Django running?", "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Send OTP";
    }
  }

  async function verifyOTP() {
    const email = document.getElementById("email").value.trim();
    const otp   = document.getElementById("otp").value.trim();
    const btn   = document.getElementById("btn-verify-otp");

    if (otp.length !== 5) {
      showMsg("msg-otp", "Please enter the full 5-character OTP.", "error");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Verifying...";
    clearMsg("msg-otp");

    try {
      const res  = await fetch(`${API_BASE}/verify-otp/`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, otp })
      });

      const data = await res.json();

      if (res.ok) {
        showStep("step-done");
      } else {
        showMsg("msg-otp", data.error || "Invalid OTP.", "error");
      }
    } catch (err) {
      showMsg("msg-otp", "Could not reach the server. Is Django running?", "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Verify OTP";
    }
  }

  function goBack() {
    document.getElementById("otp").value = "";
    clearMsg("msg-otp");
    showStep("step-email");
  }
</script>

</body>
</html>
