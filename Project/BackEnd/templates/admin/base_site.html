{% extends "admin/base.html" %}

{% block title %}{% if subtitle %}{{ subtitle }} | {% endif %}{{ title }} | {{ site_title }}{% endblock %}

{% block extrastyle %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        /* Primary Palette - Universal */
        --primary: #4f46e5;
        --secondary: #0891b2;
        --accent: #e11d48;

        /* Light Theme Defaults */
        --body-bg: #f8fafc;
        --darkened-bg: #f1f5f9;
        --header-bg: #0f172a;
        --breadcrumbs-bg: #ffffff;

        /* Text */
        --body-fg: #0f172a;
        --body-quiet-color: #475569;
        --body-loud-color: #000000;
        --header-color: #ffffff;
        --header-link-color: #f1f5f9;

        /* Links */
        --link-fg: #4f46e5;
        --link-hover-color: #3730a3;

        /* Borders & Dividers */
        --border-color: #cbd5e1;
        --hairline-color: #e2e8f0;

        /* Buttons */
        --button-bg: #4f46e5;
        --button-hover-bg: #4338ca;
        --button-fg: #fff;
        --default-button-bg: #f1f5f9;
        --default-button-hover-bg: #e2e8f0;
        --default-button-fg: #475569;

        /* Modules / Cards */
        --module-bg: #ffffff;
        --module-header-bg: #f8fafc;
        --module-header-fg: #1e1b4b;
        --module-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        --input-bg: #ffffff;
    }

    /* Dark Theme Overrides */
    @media (prefers-color-scheme: dark) {
        :root {
            --primary: #6366f1;
            --secondary: #06b6d4;
            --body-bg: #0f172a;
            --darkened-bg: #1e293b;
            --breadcrumbs-bg: #1e293b;
            --body-fg: #f8fafc;
            --body-quiet-color: #94a3b8;
            --body-loud-color: #ffffff;
            --link-fg: #22d3ee;
            --link-hover-color: #67e8f9;
            --border-color: rgba(255, 255, 255, 0.1);
            --hairline-color: rgba(255, 255, 255, 0.05);
            --module-bg: rgba(255, 255, 255, 0.03);
            --module-header-bg: rgba(255, 255, 255, 0.05);
            --module-header-fg: #ffffff;
            --module-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            --input-bg: rgba(255, 255, 255, 0.04);
            --default-button-bg: #334155;
            --default-button-hover-bg: #475569;
            --default-button-fg: #fff;
        }
    }

    /* Support for Django's explicit theme attribute */
    [data-theme="dark"] {
        --primary: #6366f1;
        --secondary: #06b6d4;
        --body-bg: #0f172a;
        --darkened-bg: #1e293b;
        --breadcrumbs-bg: #1e293b;
        --body-fg: #f8fafc;
        --body-quiet-color: #94a3b8;
        --body-loud-color: #ffffff;
        --link-fg: #22d3ee;
        --link-hover-color: #67e8f9;
        --border-color: rgba(255, 255, 255, 0.1);
        --hairline-color: rgba(255, 255, 255, 0.05);
        --module-bg: rgba(255, 255, 255, 0.03);
        --module-header-bg: rgba(255, 255, 255, 0.05);
        --module-header-fg: #ffffff;
        --module-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        --input-bg: rgba(255, 255, 255, 0.04);
        --default-button-bg: #334155;
        --default-button-hover-bg: #475569;
        --default-button-fg: #fff;
    }

    body {
        font-family: 'Outfit', sans-serif !important;
        background-color: var(--body-bg) !important;
        color: var(--body-fg) !important;
        transition: background-color 0.3s, color 0.3s;
        font-size: 14px !important;
    }

    #header {
        background: linear-gradient(135deg, #0f172a, #1e1b4b) !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
        padding: 15px 40px !important;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    #branding h1 {
        font-weight: 700 !important;
        letter-spacing: -0.02em;
        background: linear-gradient(90deg, #fff, var(--secondary));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent !important;
        font-size: 24px !important;
        margin: 0 !important;
    }

    #user-tools {
        color: var(--header-link-color) !important;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 15px;
    }

    #user-tools a {
        color: var(--header-link-color) !important;
        text-decoration: none !important;
        transition: color 0.2s;
    }

    #user-tools a:hover {
        color: var(--secondary) !important;
    }

    /* Form Rows & Alignment - Fix data visibility */
    .form-row {
        padding: 20px !important;
        border-bottom: 1px solid var(--hairline-color) !important;
        display: flex !important;
        flex-direction: row !important;
        align-items: center !important;
        gap: 20px !important;
        overflow: visible !important;
    }

    .form-row label {
        width: 160px !important;
        min-width: 160px !important;
        color: var(--body-quiet-color) !important;
        font-weight: 600 !important;
        margin: 0 !important;
    }

    .form-row input,
    .form-row select,
    .form-row textarea,
    .form-row .readonly {
        flex-grow: 1 !important;
        max-width: 600px !important;
    }

    .readonly {
        color: var(--body-fg) !important;
        font-weight: 500 !important;
    }

    /* Actions Bar - Fix Run button alignment */
    .actions {
        padding: 12px 20px !important;
        background: var(--darkened-bg) !important;
        border: 1px solid var(--border-color) !important;
        border-radius: 12px !important;
        margin-bottom: 20px !important;
        display: flex !important;
        align-items: center !important;
        gap: 15px !important;
        flex-wrap: wrap !important;
    }

    .actions select {
        height: 38px !important;
        padding: 0 12px !important;
        border-radius: 8px !important;
        border: 1px solid var(--border-color) !important;
        background: var(--input-bg) !important;
        color: var(--body-fg) !important;
        box-sizing: border-box !important;
    }

    .actions .button {
        height: 38px !important;
        padding: 0 25px !important;
        margin: 0 !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        line-height: 1 !important;
        box-sizing: border-box !important;
        border-radius: 8px !important;
    }

    /* Primary Run button color - Sophisticated Dark Slate/Indigo */
    .actions .button {
        background: linear-gradient(135deg, #1e1b4b, #312e81) !important;
        color: #ffffff !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1) !important;
    }

    /* Light Theme adjustment for Run button - Avoid "Fully Blue" */
    [data-theme="light"] .actions .button,
    body:not([data-theme="dark"]) .actions .button {
        background: linear-gradient(135deg, #334155, #475569) !important;
        color: #ffffff !important;
    }

    .actions .button:hover {
        background: var(--primary) !important;
        transform: translateY(-1px) !important;
    }

    /* Modules & Tables */    

    .module {
        background: var(--module-bg) !important;
        border: 1px solid var(--border-color) !important;
        border-radius: 16px !important;
        box-shadow: var(--module-shadow) !important;
        margin-bottom: 30px !important;
        overflow: hidden !important;
    }

    .module h2 {
        padding: 15px 20px !important;
        background: var(--module-header-bg) !important;
        color: var(--module-header-fg) !important;
        font-size: 14px !important;
        border-bottom: 1px solid var(--border-color) !important;
    }

    table thead th {
        background: var(--darkened-bg) !important;
        padding: 12px 20px !important;
        color: var(--body-quiet-color) !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        font-size: 11px !important;
    }

    /* Help Text Contrast */
    .help,
    .help-tooltip {
        color: #64748b !important;
        font-size: 12px !important;
        margin-top: 5px !important;
        display: block !important;
    }

    /* Dashboard Layout Fix - Move MYAPP to right */
    .dashboard #content {
        width: 100% !important;
        max-width: 100% !important;
        padding: 30px 40px !important;
        box-sizing: border-box !important;
    }

    .dashboard #content-main {
        display: grid !important;
        grid-template-columns: 1fr 1.2fr !important;
        /* AUTH on left, MYAPP on right */
        gap: 30px !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
        width: 8px;
    }

    ::-webkit-scrollbar-track {
        background: var(--body-bg);
    }

    ::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: var(--primary);
    }


    /* Modules & Tables */
    #recent-actions-module ,.breadcrumbs{
        display: none !important;
    }
    #nav-filter{
        border-radius: 25px;
    }
    #nav-sidebar{
        border: none;
        margin-left: 10px;
    }
    #toggle-nav-sidebar{
        margin-left: 5px;
        border: none;
    }
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name"><a href="{% url 'admin:index' %}">{{ site_header }}</a></h1>
{% endblock %}

{% block nav-global %}{% endblock %}
